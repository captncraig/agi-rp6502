# Wrapper around the SDK's mos-rp6502.cfg that puts this directory on the
# library search path before the SDK's own, so the auto-discovered bare
# "-Tlink.ld" the mos driver always appends resolves to our banked link.ld
# here instead of the SDK's flat one. See link.ld for why the split is safe
# with the existing upload pipeline.
#
# Textual position matters: an -L given directly on the command line (even
# before --config) is appended by the driver after the config file's own -L
# entries, so this override only works from inside a --config file, ahead
# of the @include below.
-L<CFGDIR>
@<CFGDIR>/../../llvm-mos-sdk/install/bin/mos-rp6502.cfg
